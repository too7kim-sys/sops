# =====================================================================
# 운영(PostgreSQL) 프로파일
#   실행 예) java -jar egov-ops.jar --spring.profiles.active=prod
#   접속정보는 환경변수로 주입 (DB_URL / DB_USERNAME / DB_PASSWORD)
# =====================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovops}
    username: ${DB_USERNAME:egovops}
    password: ${DB_PASSWORD:egovops}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000

  # 운영 스키마/초기데이터 (비파괴적: CREATE TABLE IF NOT EXISTS / ON CONFLICT DO NOTHING)
  #   최초 1회만 적재하려면 SQL_INIT_MODE=never 로 끄고 DBA가 수동 적용.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/postgresql/schema.sql
      data-locations: classpath:db/postgresql/data.sql
      encoding: UTF-8

  # 운영 환경에서는 H2 콘솔 비활성화
  h2:
    console:
      enabled: false

logging:
  level:
    egovframework: INFO
    org.springframework.security: WARN
