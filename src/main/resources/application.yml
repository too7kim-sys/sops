server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: egov-ops
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:egovops;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  messages:
    basename: messages/message
    encoding: UTF-8

# 표준프레임워크 Persistence 계층 (MyBatis) 설정
mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  type-aliases-package: egovframework.ops
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    default-fetch-size: 100
    default-statement-timeout: 30

# Git 자동배포 설정
ops:
  deploy:
    workspace: ${DEPLOY_WORKSPACE:${java.io.tmpdir}/egov-ops/deploy}
    script-timeout-sec: ${DEPLOY_SCRIPT_TIMEOUT:60}

logging:
  level:
    egovframework: DEBUG
    org.springframework.security: INFO
