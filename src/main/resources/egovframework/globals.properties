# =====================================================================
# 전역 프로퍼티 (전자정부 표준프레임워크 globals)
# =====================================================================
# Git 자동배포
ops.deploy.workspace=${java.io.tmpdir}/egov-sop/deploy
ops.deploy.script-timeout-sec=60

# 파일 첨부 저장 경로
ops.upload.dir=${java.io.tmpdir}/egov-sop/upload

# MyBatis 매퍼 XML 자동 반영(개발) : 소스 매퍼 디렉터리 변경 감시 → 재기동 없이 반영
#  - 감시 디렉터리가 없으면(실배포 WAR) 자동 비활성화되어 운영 영향 없음
#  - 운영에서 강제 비활성화하려면 ops.mapper.reload.enabled=false
ops.mapper.reload.enabled=true
ops.mapper.reload.dir=src/main/resources/egovframework/mapper
ops.mapper.reload.interval-ms=2000
