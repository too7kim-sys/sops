<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('변경 상세')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('change')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 변경관리 &gt; 상세</div>
        <div class="page-head">
            <div class="page-title">변경 상세 <span style="color:#888;font-weight:400;">(CHG-<span th:text="${change.chgId}">1</span>)</span></div>
            <div class="toolbar">
                <a th:href="@{/change/edit/{id}(id=${change.chgId})}" class="btn btn-default">수정</a>
                <form th:action="@{/change/delete/{id}(id=${change.chgId})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3>변경 정보</h3>
                <table class="form">
                    <tr><th>대상 시스템</th><td th:text="${change.sysNm}">시스템</td></tr>
                    <tr><th>제목</th><td th:text="${change.title}">제목</td></tr>
                    <tr><th>유형 / 상태</th><td>
                        <span class="badge" th:text="${change.chgTypeNm}">유형</span>
                        &nbsp;
                        <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(change.status)}" th:text="${change.statusNm}">상태</span>
                    </td></tr>
                    <tr><th>요청자 / 요청일시</th><td><span th:text="${change.reqId} ?: '-'">-</span> / <span th:text="${change.reqDt} ?: '-'">-</span></td></tr>
                    <tr><th>적용 예정일</th><td th:text="${change.planDt} ?: '-'">-</td></tr>
                    <tr><th>적용 일시</th><td th:text="${change.applyDt} ?: '-'">-</td></tr>
                    <tr><th>변경 사유</th><td style="white-space:pre-line;" th:text="${change.reason} ?: '-'">-</td></tr>
                    <tr><th>변경 내용</th><td style="white-space:pre-line;" th:text="${change.content} ?: '-'">-</td></tr>
                    <tr><th>심의자 / 심의일시</th><td><span th:text="${change.apprId} ?: '-'">-</span> / <span th:text="${change.apprDt} ?: '-'">-</span></td></tr>
                    <tr><th>심의 의견</th><td style="white-space:pre-line;" th:text="${change.apprOpinion} ?: '-'">-</td></tr>
                </table>
            </div>

            <div th:unless="${change.status == 'COMPLETED' or change.status == 'REJECTED'}">
                <!-- 심의/승인 -->
                <div class="panel">
                    <h3>심의/승인</h3>
                    <form method="post" th:action="@{/change/approve}">
                        <input type="hidden" name="chgId" th:value="${change.chgId}"/>
                        <table class="form">
                            <tr><th>심의 결과 <span class="required">*</span></th>
                                <td>
                                    <select name="status" required>
                                        <option value="REVIEWING">검토</option>
                                        <option value="APPROVED">승인</option>
                                        <option value="REJECTED">반려</option>
                                    </select>
                                </td></tr>
                            <tr><th>심의 의견</th><td><textarea name="apprOpinion" rows="3" th:text="${change.apprOpinion}"></textarea></td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-success">심의 등록</button>
                        </div>
                    </form>
                </div>

                <!-- 적용 -->
                <div class="panel">
                    <h3>적용 처리</h3>
                    <form method="post" th:action="@{/change/apply}">
                        <input type="hidden" name="chgId" th:value="${change.chgId}"/>
                        <table class="form">
                            <tr><th>적용 상태 <span class="required">*</span></th>
                                <td>
                                    <select name="status" required>
                                        <option value="APPLIED">적용</option>
                                        <option value="COMPLETED">완료</option>
                                    </select>
                                </td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-primary">적용 등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="toolbar"><a th:href="@{/change/list}" class="btn btn-default">＜ 목록</a></div>
    </main>
</div>
</body>
</html>
