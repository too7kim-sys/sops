<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('변경요청/수정')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('change')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 변경관리 &gt; <span th:text="${change.chgId == null}?'요청':'수정'">요청</span></div>
        <div class="page-head">
            <div class="page-title" th:text="${change.chgId == null}?'변경요청':'변경 정보 수정'">변경요청</div>
        </div>

        <form method="post" th:action="${change.chgId == null}?@{/change/insert}:@{/change/update}">
            <input type="hidden" name="chgId" th:value="${change.chgId}"/>
            <div class="panel">
                <table class="form">
                    <tr>
                        <th>대상 시스템 <span class="required">*</span></th>
                        <td>
                            <select name="sysId" required>
                                <option value="">선택</option>
                                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                                        th:selected="${s.sysId == change.sysId}">시스템</option>
                            </select>
                        </td>
                        <th>변경 유형 <span class="required">*</span></th>
                        <td>
                            <select name="chgType" required>
                                <option th:each="c : ${typeList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                        th:selected="${c.codeId == change.chgType}">유형</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>제목 <span class="required">*</span></th>
                        <td colspan="3"><input type="text" name="title" th:value="${change.title}" required/></td>
                    </tr>
                    <tr>
                        <th>적용 예정일</th>
                        <td colspan="3"><input type="date" name="planDt" th:value="${change.planDt}"/></td>
                    </tr>
                    <tr>
                        <th>변경 사유</th>
                        <td colspan="3"><textarea name="reason" rows="3" th:text="${change.reason}"></textarea></td>
                    </tr>
                    <tr>
                        <th>변경 내용</th>
                        <td colspan="3"><textarea name="content" rows="5" th:text="${change.content}"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="toolbar right" style="justify-content:flex-end;">
                <a th:href="@{/change/list}" class="btn btn-default">목록</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
