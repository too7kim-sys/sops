<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('요청 상세')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('csr')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 요청관리 &gt; 상세</div>
        <div class="page-head">
            <div class="page-title">요청 상세 <span style="color:#888;font-weight:400;">(CSR-<span th:text="${csr.csrId}">1</span>)</span></div>
            <div class="toolbar">
                <a th:href="@{/csr/edit/{id}(id=${csr.csrId})}" class="btn btn-default">수정</a>
                <form th:action="@{/csr/delete/{id}(id=${csr.csrId})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3>요청 정보</h3>
                <table class="form">
                    <tr><th>대상 시스템</th><td th:text="${csr.sysNm}">시스템</td></tr>
                    <tr><th>제목</th><td th:text="${csr.title}">제목</td></tr>
                    <tr><th>유형 / 우선순위</th><td>
                        <span th:text="${csr.csrTypeNm}">유형</span>
                        &nbsp;/&nbsp;
                        <span th:text="${csr.priorityNm}">우선순위</span>
                    </td></tr>
                    <tr><th>상태</th><td>
                        <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(csr.status)}" th:text="${csr.statusNm}">상태</span>
                    </td></tr>
                    <tr><th>요청자 / 요청일시</th><td><span th:text="${csr.reqId} ?: '-'">-</span> / <span th:text="${csr.reqDt} ?: '-'">-</span></td></tr>
                    <tr><th>담당자</th><td th:text="${csr.chargerId} ?: '-'">-</td></tr>
                    <tr><th>처리일시</th><td th:text="${csr.procDt} ?: '-'">-</td></tr>
                    <tr><th>요청 내용</th><td style="white-space:pre-line;" th:text="${csr.content}">내용</td></tr>
                    <tr><th>처리 내용</th><td style="white-space:pre-line;" th:text="${csr.procContent} ?: '-'">-</td></tr>
                </table>
            </div>

            <div>
                <!-- 요청 처리 (상태전이) -->
                <div class="panel" th:if="${csr.status != 'CLOSED' and csr.status != 'REJECTED'}">
                    <h3>요청 처리</h3>
                    <form method="post" th:action="@{/csr/process}">
                        <input type="hidden" name="csrId" th:value="${csr.csrId}"/>
                        <table class="form">
                            <tr><th>처리 상태 <span class="required">*</span></th>
                                <td>
                                    <select name="status" required>
                                        <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                                th:selected="${c.codeId == csr.status}">상태</option>
                                    </select>
                                </td></tr>
                            <tr><th>담당자</th><td><input type="text" name="chargerId" th:value="${csr.chargerId}"/></td></tr>
                            <tr><th>처리 내용</th><td><textarea name="procContent" rows="4" th:text="${csr.procContent}"></textarea></td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-success">처리 등록</button>
                        </div>
                    </form>
                </div>

                <!-- 처리 이력 -->
                <div class="panel">
                    <h3>처리 이력</h3>
                    <ul class="history">
                        <li th:each="h : ${csr.historyList}">
                            <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(h.status)}" th:text="${h.statusNm}">상태</span>
                            <span style="white-space:pre-line;" th:text="${h.content}">내용</span>
                            <div class="h-meta"><span th:text="${h.procId}">처리자</span> · <span th:text="${h.procDt}">일시</span></div>
                        </li>
                        <li th:if="${#lists.isEmpty(csr.historyList)}" style="border:none;">이력이 없습니다.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="toolbar"><a th:href="@{/csr/list}" class="btn btn-default">＜ 목록</a></div>
    </main>
</div>
</body>
</html>
