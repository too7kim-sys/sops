<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('요청 등록/수정')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('csr')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 요청관리 &gt; <span th:text="${csr.csrId == null}?'등록':'수정'">등록</span></div>
        <div class="page-head">
            <div class="page-title" th:text="${csr.csrId == null}?'요청 등록':'요청 정보 수정'">요청 등록</div>
        </div>

        <form method="post" th:action="${csr.csrId == null}?@{/csr/insert}:@{/csr/update}">
            <input type="hidden" name="csrId" th:value="${csr.csrId}"/>
            <div class="panel">
                <table class="form">
                    <tr>
                        <th>대상 시스템 <span class="required">*</span></th>
                        <td>
                            <select name="sysId" required>
                                <option value="">선택</option>
                                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                                        th:selected="${s.sysId == csr.sysId}">시스템</option>
                            </select>
                        </td>
                        <th>요청 유형 <span class="required">*</span></th>
                        <td>
                            <select name="csrType" required>
                                <option th:each="c : ${typeList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                        th:selected="${c.codeId == csr.csrType}">유형</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>우선순위 <span class="required">*</span></th>
                        <td>
                            <select name="priority" required>
                                <option th:each="c : ${priorityList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                        th:selected="${c.codeId == csr.priority}">우선순위</option>
                            </select>
                        </td>
                        <th>담당자</th>
                        <td><input type="text" name="chargerId" th:value="${csr.chargerId}" placeholder="처리 담당자 ID"/></td>
                    </tr>
                    <tr>
                        <th>제목 <span class="required">*</span></th>
                        <td colspan="3"><input type="text" name="title" th:value="${csr.title}" required/></td>
                    </tr>
                    <tr>
                        <th>요청 내용</th>
                        <td colspan="3"><textarea name="content" rows="5" th:text="${csr.content}"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="toolbar right" style="justify-content:flex-end;">
                <a th:href="@{/csr/list}" class="btn btn-default">목록</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
