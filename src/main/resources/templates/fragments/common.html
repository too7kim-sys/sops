<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' - 범정부 응용프로그램 운영관리시스템'">eGov-Ops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ============ 상단 헤더 ============ -->
<header class="topbar" th:fragment="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/main}">
            <span class="brand-mark">eGov</span>
            <span class="brand-name">범정부 응용프로그램 운영관리시스템</span>
        </a>
        <div class="topbar-right" sec:authorize="isAuthenticated()">
            <span class="user-info">
                <strong sec:authentication="principal.userNm">사용자</strong>님
                <span class="role-badge" sec:authentication="principal.user.role">ROLE</span>
            </span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn btn-ghost btn-sm">로그아웃</button>
            </form>
        </div>
    </div>
</header>

<!-- ============ 좌측 메뉴 ============ -->
<nav class="sidebar" th:fragment="sidebar(menu)">
    <ul class="menu">
        <li><a th:href="@{/main}" th:classappend="${menu=='dashboard'}?'active'">운영현황</a></li>
        <li class="menu-group">표준운영절차</li>
        <li><a th:href="@{/incident/list}" th:classappend="${menu=='incident'}?'active'">장애관리</a></li>
        <li><a th:href="@{/change/list}"   th:classappend="${menu=='change'}?'active'">변경관리</a></li>
        <li><a th:href="@{/release/list}"  th:classappend="${menu=='release'}?'active'">배포관리</a></li>
        <li><a th:href="@{/check/list}"    th:classappend="${menu=='check'}?'active'">운영점검</a></li>
        <li class="menu-group">기준정보 관리</li>
        <li><a th:href="@{/system/list}"   th:classappend="${menu=='system'}?'active'">응용시스템</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/sys/user/list}" th:classappend="${menu=='user'}?'active'">사용자관리</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/sys/code/list}" th:classappend="${menu=='code'}?'active'">공통코드</a></li>
    </ul>
    <div class="sidebar-foot">전자정부 표준프레임워크 기반</div>
</nav>

<!-- ============ 페이징 ============ -->
<div th:fragment="paging(pageInfo, baseUrl)" class="paging" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
    <a th:if="${pageInfo.currentPageNo > 1}" th:href="@{${baseUrl}(pageIndex=${pageInfo.currentPageNo - 1})}">‹ 이전</a>
    <span th:each="p : ${#numbers.sequence(pageInfo.firstPageNoOnPageList, pageInfo.lastPageNoOnPageList)}">
        <a th:href="@{${baseUrl}(pageIndex=${p})}"
           th:text="${p}"
           th:classappend="${p == pageInfo.currentPageNo}?'on'">1</a>
    </span>
    <a th:if="${pageInfo.currentPageNo < pageInfo.totalPageCount}" th:href="@{${baseUrl}(pageIndex=${pageInfo.currentPageNo + 1})}">다음 ›</a>
</div>

</body>
</html>
