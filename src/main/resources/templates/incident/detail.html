<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('장애 상세')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('incident')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 장애관리 &gt; 상세</div>
        <div class="page-head">
            <div class="page-title">장애 상세 <span style="color:#888;font-weight:400;">(INC-<span th:text="${incident.incId}">1</span>)</span></div>
            <div class="toolbar">
                <a th:href="@{/incident/edit/{id}(id=${incident.incId})}" class="btn btn-default">수정</a>
                <form th:action="@{/incident/delete/{id}(id=${incident.incId})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3>장애 정보</h3>
                <table class="form">
                    <tr><th>대상 시스템</th><td th:text="${incident.sysNm}">시스템</td></tr>
                    <tr><th>제목</th><td th:text="${incident.title}">제목</td></tr>
                    <tr><th>등급 / 상태</th><td>
                        <span class="badge" th:classappend="'sev-' + ${incident.severity}" th:text="${incident.severity}+'등급'">등급</span>
                        &nbsp;
                        <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(incident.status)}" th:text="${incident.statusNm}">상태</span>
                    </td></tr>
                    <tr><th>발생 / 접수</th><td><span th:text="${incident.occrDt}">-</span> / <span th:text="${incident.rcptDt}">-</span></td></tr>
                    <tr><th>목표복구일시</th><td th:text="${incident.targetResolveDt} ?: '-'">-</td></tr>
                    <tr th:if="${incident.slaStatus != null}"><th>SLA</th><td>
                        <span class="badge"
                              th:classappend="${incident.slaStatus == '준수'} ? 'sla-ok' : (${incident.slaStatus == '진행중'} ? 'sla-warn' : 'sla-viol')"
                              th:text="${incident.slaStatus}">SLA</span>
                    </td></tr>
                    <tr><th>조치완료</th><td th:text="${incident.resolveDt} ?: '-'">-</td></tr>
                    <tr><th>연계 문제</th><td th:text="${incident.refPrbId != null} ? ('PRB-' + ${incident.refPrbId}) : '-'">-</td></tr>
                    <tr><th>담당자</th><td th:text="${incident.chargerId} ?: '-'">-</td></tr>
                    <tr><th>장애 내용</th><td style="white-space:pre-line;" th:text="${incident.content}">내용</td></tr>
                    <tr><th>장애 원인</th><td style="white-space:pre-line;" th:text="${incident.cause} ?: '-'">-</td></tr>
                    <tr><th>조치 내용</th><td style="white-space:pre-line;" th:text="${incident.action} ?: '-'">-</td></tr>
                </table>
            </div>

            <div>
                <!-- 장애 처리 (상태전이) -->
                <div class="panel" th:if="${incident.status != 'CLOSED'}">
                    <h3>장애 처리</h3>
                    <form method="post" th:action="@{/incident/process}">
                        <input type="hidden" name="incId" th:value="${incident.incId}"/>
                        <table class="form">
                            <tr><th>처리 상태 <span class="required">*</span></th>
                                <td>
                                    <select name="status" required>
                                        <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                                th:selected="${c.codeId == incident.status}">상태</option>
                                    </select>
                                </td></tr>
                            <tr><th>담당자</th><td><input type="text" name="chargerId" th:value="${incident.chargerId}"/></td></tr>
                            <tr><th>연계 문제</th><td><input type="number" name="refPrbId" th:value="${incident.refPrbId}" placeholder="연계 문제 ID (선택)"/></td></tr>
                            <tr><th>장애 원인</th><td><textarea name="cause" rows="3" th:text="${incident.cause}"></textarea></td></tr>
                            <tr><th>조치 내용</th><td><textarea name="action" rows="3" th:text="${incident.action}"></textarea></td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-success">처리 등록</button>
                        </div>
                    </form>
                </div>

                <!-- 처리 이력 -->
                <div class="panel">
                    <h3>처리 이력</h3>
                    <ul class="history">
                        <li th:each="h : ${incident.historyList}">
                            <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(h.status)}" th:text="${h.statusNm}">상태</span>
                            <span style="white-space:pre-line;" th:text="${h.content}">내용</span>
                            <div class="h-meta"><span th:text="${h.procId}">처리자</span> · <span th:text="${h.procDt}">일시</span></div>
                        </li>
                        <li th:if="${#lists.isEmpty(incident.historyList)}" style="border:none;">이력이 없습니다.</li>
                    </ul>
                </div>

                <!-- 에스컬레이션 -->
                <div class="panel">
                    <h3>에스컬레이션</h3>
                    <ul class="history">
                        <li th:each="e : ${incident.escalList}">
                            <span class="badge" th:text="${e.escalLevelNm} ?: ${e.escalLevel}">단계</span>
                            <span th:if="${e.escalTo != null and e.escalTo != ''}" th:text="'→ ' + ${e.escalTo}">대상</span>
                            <span style="white-space:pre-line;" th:text="${e.reason}">사유</span>
                            <div class="h-meta"><span th:text="${e.escalBy}">수행자</span> · <span th:text="${e.escalDt}">일시</span></div>
                        </li>
                        <li th:if="${#lists.isEmpty(incident.escalList)}" style="border:none;">에스컬레이션 이력이 없습니다.</li>
                    </ul>
                    <form method="post" th:action="@{/incident/escalate}" style="margin-top:12px;">
                        <input type="hidden" name="incId" th:value="${incident.incId}"/>
                        <table class="form">
                            <tr><th>단계 <span class="required">*</span></th>
                                <td>
                                    <select name="escalLevel" required>
                                        <option value="">선택</option>
                                        <option th:each="c : ${escalLevelList}" th:value="${c.codeId}" th:text="${c.codeNm}">단계</option>
                                    </select>
                                </td></tr>
                            <tr><th>대상</th><td><input type="text" name="escalTo" placeholder="에스컬레이션 대상"/></td></tr>
                            <tr><th>사유</th><td><textarea name="reason" rows="2"></textarea></td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-primary">에스컬레이션 등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="toolbar"><a th:href="@{/incident/list}" class="btn btn-default">＜ 목록</a></div>
    </main>
</div>
</body>
</html>
