<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('장애 접수/수정')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('incident')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 장애관리 &gt; <span th:text="${incident.incId == null}?'접수':'수정'">접수</span></div>
        <div class="page-head">
            <div class="page-title" th:text="${incident.incId == null}?'장애 접수':'장애 정보 수정'">장애 접수</div>
        </div>

        <form method="post" th:action="${incident.incId == null}?@{/incident/insert}:@{/incident/update}">
            <input type="hidden" name="incId" th:value="${incident.incId}"/>
            <div class="panel">
                <table class="form">
                    <tr>
                        <th>대상 시스템 <span class="required">*</span></th>
                        <td>
                            <select name="sysId" required>
                                <option value="">선택</option>
                                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                                        th:selected="${s.sysId == incident.sysId}">시스템</option>
                            </select>
                        </td>
                        <th>장애 등급 <span class="required">*</span></th>
                        <td>
                            <select name="severity" required>
                                <option th:each="c : ${severityList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                        th:selected="${c.codeId == incident.severity}">등급</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>제목 <span class="required">*</span></th>
                        <td colspan="3"><input type="text" name="title" th:value="${incident.title}" required/></td>
                    </tr>
                    <tr>
                        <th>발생일시</th>
                        <td><input type="datetime-local" name="occrDt" th:value="${incident.occrDt != null}? ${#strings.replace(incident.occrDt,' ','T')}"/></td>
                        <th>담당자</th>
                        <td><input type="text" name="chargerId" th:value="${incident.chargerId}" placeholder="처리 담당자 ID"/></td>
                    </tr>
                    <tr>
                        <th>장애 내용</th>
                        <td colspan="3"><textarea name="content" rows="5" th:text="${incident.content}"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="toolbar right" style="justify-content:flex-end;">
                <a th:href="@{/incident/list}" class="btn btn-default">목록</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
