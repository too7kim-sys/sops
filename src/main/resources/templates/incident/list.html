<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('장애관리')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('incident')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 장애관리</div>
        <div class="page-head">
            <div>
                <div class="page-title">장애관리</div>
                <div class="page-desc">접수 → 원인분석 → 조치 → 종결 표준 처리절차</div>
            </div>
            <div class="toolbar">
                <a th:href="@{/incident/write}" class="btn btn-primary">＋ 장애 접수</a>
            </div>
        </div>

        <form method="get" th:action="@{/incident/list}" class="searchbar">
            <select name="searchSysId">
                <option value="">전체 시스템</option>
                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                        th:selected="${s.sysId == searchVO.searchSysId}">시스템</option>
            </select>
            <select name="searchStatus">
                <option value="">전체 상태</option>
                <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                        th:selected="${c.codeId == searchVO.searchStatus}">상태</option>
            </select>
            <input type="text" name="searchKeyword" th:value="${searchVO.searchKeyword}" placeholder="제목 검색"/>
            <button type="submit" class="btn btn-default">검색</button>
        </form>

        <div class="panel mb0">
            <p style="margin-bottom:10px;color:#777;font-size:13px;">총 <b th:text="${totalCnt}">0</b>건</p>
            <table class="list">
                <thead>
                <tr>
                    <th class="center" style="width:70px;">번호</th>
                    <th style="width:160px;">시스템</th>
                    <th>제목</th>
                    <th class="center" style="width:90px;">등급</th>
                    <th class="center" style="width:90px;">상태</th>
                    <th class="center" style="width:90px;">담당자</th>
                    <th class="center" style="width:130px;">접수일시</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${incidentList}">
                    <td class="center" th:text="${i.incId}">1</td>
                    <td th:text="${i.sysNm}">시스템</td>
                    <td><a th:href="@{/incident/detail/{id}(id=${i.incId})}" th:text="${i.title}">제목</a></td>
                    <td class="center"><span class="badge" th:classappend="'sev-' + ${i.severity}" th:text="${i.severity}+'등급'">등급</span></td>
                    <td class="center"><span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(i.status)}" th:text="${i.statusNm}">상태</span></td>
                    <td class="center" th:text="${i.chargerId}">담당</td>
                    <td class="center" th:text="${i.rcptDt}">일시</td>
                </tr>
                <tr th:if="${#lists.isEmpty(incidentList)}"><td colspan="7" class="empty">등록된 장애가 없습니다.</td></tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/common :: paging(${pageInfo}, '/incident/list')}"></div>
        </div>
    </main>
</div>
</body>
</html>
