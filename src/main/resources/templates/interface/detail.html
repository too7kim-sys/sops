<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('연계 상세')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('interface')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 연계관리 &gt; 상세</div>
        <div class="page-head">
            <div class="page-title">연계 상세 <span style="color:#888;font-weight:400;">(INTF-<span th:text="${interface.intfId}">1</span>)</span></div>
            <div class="toolbar">
                <form th:action="@{/interface/delete/{id}(id=${interface.intfId})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3>연계 정보</h3>
                <table class="form">
                    <tr><th>대상 시스템</th><td th:text="${interface.sysNm}">시스템</td></tr>
                    <tr><th>제목</th><td th:text="${interface.title}">제목</td></tr>
                    <tr><th>상대 시스템</th><td th:text="${interface.partnerSys} ?: '-'">-</td></tr>
                    <tr><th>연계 유형 / 상태</th><td>
                        <span th:text="${interface.ifTypeNm}">유형</span>
                        &nbsp;
                        <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(interface.status)}" th:text="${interface.statusNm}">상태</span>
                    </td></tr>
                    <tr><th>요청자 / 요청일시</th><td><span th:text="${interface.reqId}">-</span> / <span th:text="${interface.reqDt}">-</span></td></tr>
                    <tr><th>담당자</th><td th:text="${interface.chargerId} ?: '-'">-</td></tr>
                    <tr><th>예정일 / 완료일시</th><td><span th:text="${interface.planDt} ?: '-'">-</span> / <span th:text="${interface.completeDt} ?: '-'">-</span></td></tr>
                    <tr><th>연계 데이터</th><td style="white-space:pre-line;" th:text="${interface.dataDesc} ?: '-'">-</td></tr>
                    <tr><th>처리 결과</th><td style="white-space:pre-line;" th:text="${interface.result} ?: '-'">-</td></tr>
                </table>
            </div>

            <div>
                <!-- 연계 처리 (상태전이) -->
                <div class="panel" th:if="${interface.status != 'COMPLETED' and interface.status != 'REJECTED'}">
                    <h3>연계 처리</h3>
                    <form method="post" th:action="@{/interface/process}">
                        <input type="hidden" name="intfId" th:value="${interface.intfId}"/>
                        <table class="form">
                            <tr><th>처리 상태 <span class="required">*</span></th>
                                <td>
                                    <select name="status" required>
                                        <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                                th:selected="${c.codeId == interface.status}">상태</option>
                                    </select>
                                </td></tr>
                            <tr><th>담당자</th><td><input type="text" name="chargerId" th:value="${interface.chargerId}"/></td></tr>
                            <tr><th>처리 결과</th><td><textarea name="result" rows="4" th:text="${interface.result}"></textarea></td></tr>
                        </table>
                        <div class="right" style="margin-top:12px;">
                            <button type="submit" class="btn btn-success">처리 등록</button>
                        </div>
                    </form>
                </div>

                <!-- 처리 이력 -->
                <div class="panel">
                    <h3>처리 이력</h3>
                    <ul class="history">
                        <li th:each="h : ${interface.historyList}">
                            <span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(h.status)}" th:text="${h.statusNm}">상태</span>
                            <span style="white-space:pre-line;" th:text="${h.content}">내용</span>
                            <div class="h-meta"><span th:text="${h.procId}">처리자</span> · <span th:text="${h.procDt}">일시</span></div>
                        </li>
                        <li th:if="${#lists.isEmpty(interface.historyList)}" style="border:none;">이력이 없습니다.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="toolbar"><a th:href="@{/interface/list}" class="btn btn-default">＜ 목록</a></div>
    </main>
</div>
</body>
</html>
