<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('연계관리')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('interface')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 연계관리</div>
        <div class="page-head">
            <div>
                <div class="page-title">연계관리</div>
                <div class="page-desc">요청 → 검토 → 계획 → 작업 → 테스트 → 완료 표준 연계절차</div>
            </div>
            <div class="toolbar">
                <a th:href="@{/interface/write}" class="btn btn-primary">＋ 연계 요청</a>
            </div>
        </div>

        <form method="get" th:action="@{/interface/list}" class="searchbar">
            <select name="searchSysId">
                <option value="">전체 시스템</option>
                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                        th:selected="${s.sysId == searchVO.searchSysId}">시스템</option>
            </select>
            <select name="searchStatus">
                <option value="">전체 상태</option>
                <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                        th:selected="${c.codeId == searchVO.searchStatus}">상태</option>
            </select>
            <input type="text" name="searchKeyword" th:value="${searchVO.searchKeyword}" placeholder="제목 검색"/>
            <button type="submit" class="btn btn-default">검색</button>
        </form>

        <div class="panel mb0">
            <p style="margin-bottom:10px;color:#777;font-size:13px;">총 <b th:text="${totalCnt}">0</b>건</p>
            <table class="list">
                <thead>
                <tr>
                    <th class="center" style="width:70px;">번호</th>
                    <th style="width:160px;">시스템</th>
                    <th>제목</th>
                    <th style="width:160px;">상대시스템</th>
                    <th class="center" style="width:90px;">유형</th>
                    <th class="center" style="width:100px;">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${interfaceList}">
                    <td class="center" th:text="${i.intfId}">1</td>
                    <td th:text="${i.sysNm}">시스템</td>
                    <td><a th:href="@{/interface/detail/{id}(id=${i.intfId})}" th:text="${i.title}">제목</a></td>
                    <td th:text="${i.partnerSys} ?: '-'">상대시스템</td>
                    <td class="center" th:text="${i.ifTypeNm}">유형</td>
                    <td class="center"><span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(i.status)}" th:text="${i.statusNm}">상태</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(interfaceList)}"><td colspan="6" class="empty">등록된 연계가 없습니다.</td></tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/common :: paging(${pageInfo}, '/interface/list')}"></div>
        </div>
    </main>
</div>
</body>
</html>
