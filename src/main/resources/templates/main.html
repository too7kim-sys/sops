<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('운영현황')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('dashboard')}"></nav>
    <main class="content">
        <div class="page-head">
            <div>
                <div class="page-title">운영현황 대시보드</div>
                <div class="page-desc">응용프로그램 표준운영절차 통합 모니터링</div>
            </div>
        </div>

        <!-- 요약 지표 -->
        <div class="cards">
            <div class="card crit">
                <div class="label">진행중 장애</div>
                <div class="value" th:text="${summary.openIncident}">0</div>
            </div>
            <div class="card warn">
                <div class="label">승인대기 변경</div>
                <div class="value" th:text="${summary.pendingChange}">0</div>
            </div>
            <div class="card info">
                <div class="label">금일 배포</div>
                <div class="value" th:text="${summary.todayRelease}">0</div>
            </div>
            <div class="card warn">
                <div class="label">금일 점검이상</div>
                <div class="value" th:text="${summary.abnormalCheck}">0</div>
            </div>
            <div class="card ok">
                <div class="label">운영 시스템</div>
                <div class="value" th:text="${summary.systemCnt}">0</div>
            </div>
        </div>

        <div class="grid-2">
            <!-- 장애 상태별 -->
            <div class="panel">
                <h3>장애 처리현황</h3>
                <div class="statbar">
                    <span class="chip" th:each="s : ${incidentStat}">
                        <span th:text="${s.name}">상태</span><b th:text="${s.cnt}">0</b>
                    </span>
                </div>
            </div>
            <!-- 변경 상태별 -->
            <div class="panel">
                <h3>변경 처리현황</h3>
                <div class="statbar">
                    <span class="chip" th:each="s : ${changeStat}">
                        <span th:text="${s.name}">상태</span><b th:text="${s.cnt}">0</b>
                    </span>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <!-- 최근 장애 -->
            <div class="panel">
                <h3>최근 장애 접수</h3>
                <table class="list">
                    <thead>
                    <tr><th>시스템</th><th>제목</th><th class="center">등급</th><th class="center">상태</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${recentIncidents}">
                        <td th:text="${i.sysNm}">시스템</td>
                        <td><a th:href="@{/incident/detail/{id}(id=${i.incId})}" th:text="${i.title}">제목</a></td>
                        <td class="center"><span class="badge" th:classappend="'sev-' + ${i.severity}" th:text="${i.severity}+'등급'">등급</span></td>
                        <td class="center"><span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(i.status)}" th:text="${i.statusNm}">상태</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentIncidents)}"><td colspan="4" class="empty">데이터가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- 최근 변경 -->
            <div class="panel">
                <h3>최근 변경 요청</h3>
                <table class="list">
                    <thead>
                    <tr><th>시스템</th><th>제목</th><th class="center">상태</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${recentChanges}">
                        <td th:text="${c.sysNm}">시스템</td>
                        <td><a th:href="@{/change/detail/{id}(id=${c.chgId})}" th:text="${c.title}">제목</a></td>
                        <td class="center"><span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(c.status)}" th:text="${c.statusNm}">상태</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentChanges)}"><td colspan="3" class="empty">데이터가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
