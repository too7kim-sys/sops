<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('문제 등록')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('problem')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 문제관리 &gt; 등록</div>
        <div class="page-head">
            <div class="page-title">문제 등록</div>
        </div>

        <form method="post" th:action="@{/problem/insert}">
            <div class="panel">
                <table class="form">
                    <tr>
                        <th>대상 시스템 <span class="required">*</span></th>
                        <td>
                            <select name="sysId" required>
                                <option value="">선택</option>
                                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                                        th:selected="${s.sysId == problem.sysId}">시스템</option>
                            </select>
                        </td>
                        <th>우선순위 <span class="required">*</span></th>
                        <td>
                            <select name="priority" required>
                                <option th:each="c : ${priorityList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                                        th:selected="${c.codeId == problem.priority}">우선순위</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>제목 <span class="required">*</span></th>
                        <td colspan="3"><input type="text" name="title" th:value="${problem.title}" required/></td>
                    </tr>
                    <tr>
                        <th>내용</th>
                        <td colspan="3"><textarea name="content" rows="5" th:text="${problem.content}"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="toolbar right" style="justify-content:flex-end;">
                <a th:href="@{/problem/list}" class="btn btn-default">목록</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
