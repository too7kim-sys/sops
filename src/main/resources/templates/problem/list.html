<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('문제관리')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('problem')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 문제관리</div>
        <div class="page-head">
            <div>
                <div class="page-title">문제관리</div>
                <div class="page-desc">등록 → 분석 → 원인규명 → 해결 → 종결 표준 처리절차</div>
            </div>
            <div class="toolbar">
                <a th:href="@{/problem/write}" class="btn btn-primary">＋ 문제 등록</a>
            </div>
        </div>

        <form method="get" th:action="@{/problem/list}" class="searchbar">
            <select name="searchSysId">
                <option value="">전체 시스템</option>
                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                        th:selected="${s.sysId == searchVO.searchSysId}">시스템</option>
            </select>
            <select name="searchStatus">
                <option value="">전체 상태</option>
                <option th:each="c : ${statusList}" th:value="${c.codeId}" th:text="${c.codeNm}"
                        th:selected="${c.codeId == searchVO.searchStatus}">상태</option>
            </select>
            <input type="text" name="searchKeyword" th:value="${searchVO.searchKeyword}" placeholder="제목 검색"/>
            <button type="submit" class="btn btn-default">검색</button>
        </form>

        <div class="panel mb0">
            <p style="margin-bottom:10px;color:#777;font-size:13px;">총 <b th:text="${totalCnt}">0</b>건</p>
            <table class="list">
                <thead>
                <tr>
                    <th class="center" style="width:70px;">번호</th>
                    <th style="width:160px;">시스템</th>
                    <th>제목</th>
                    <th class="center" style="width:90px;">우선순위</th>
                    <th class="center" style="width:90px;">상태</th>
                    <th class="center" style="width:90px;">담당자</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${problemList}">
                    <td class="center" th:text="${p.prbId}">1</td>
                    <td th:text="${p.sysNm}">시스템</td>
                    <td><a th:href="@{/problem/detail/{id}(id=${p.prbId})}" th:text="${p.title}">제목</a></td>
                    <td class="center"><span class="badge" th:classappend="'lv-' + ${#strings.toLowerCase(p.priority)}" th:text="${p.priorityNm}">우선순위</span></td>
                    <td class="center"><span class="badge" th:classappend="'st-' + ${#strings.toLowerCase(p.status)}" th:text="${p.statusNm}">상태</span></td>
                    <td class="center" th:text="${p.chargerId}">담당</td>
                </tr>
                <tr th:if="${#lists.isEmpty(problemList)}"><td colspan="6" class="empty">등록된 문제가 없습니다.</td></tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/common :: paging(${pageInfo}, '/problem/list')}"></div>
        </div>
    </main>
</div>
</body>
</html>
