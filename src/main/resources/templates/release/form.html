<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('배포계획 등록/수정')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('release')}"></nav>
    <main class="content">
        <div class="breadcrumb">표준운영절차 &gt; 배포관리 &gt; <span th:text="${release.relId == null}?'등록':'수정'">등록</span></div>
        <div class="page-head">
            <div class="page-title" th:text="${release.relId == null}?'배포계획 등록':'배포 정보 수정'">배포계획 등록</div>
        </div>

        <form method="post" th:action="${release.relId == null}?@{/release/insert}:@{/release/update}">
            <input type="hidden" name="relId" th:value="${release.relId}"/>
            <div class="panel">
                <table class="form">
                    <tr>
                        <th>대상 시스템 <span class="required">*</span></th>
                        <td>
                            <select name="sysId" required>
                                <option value="">선택</option>
                                <option th:each="s : ${systemList}" th:value="${s.sysId}" th:text="${s.sysNm}"
                                        th:selected="${s.sysId == release.sysId}">시스템</option>
                            </select>
                        </td>
                        <th>버전 <span class="required">*</span></th>
                        <td><input type="text" name="ver" th:value="${release.ver}" placeholder="예: v1.2.0" required/></td>
                    </tr>
                    <tr>
                        <th>제목 <span class="required">*</span></th>
                        <td colspan="3"><input type="text" name="title" th:value="${release.title}" required/></td>
                    </tr>
                    <tr>
                        <th>연계 변경ID</th>
                        <td><input type="number" name="chgId" th:value="${release.chgId}" placeholder="변경요청 ID(선택)"/></td>
                        <th>배포예정일시</th>
                        <td><input type="datetime-local" name="planDt" th:value="${release.planDt != null}? ${#strings.replace(release.planDt,' ','T')}"/></td>
                    </tr>
                    <tr>
                        <th>배포 내용</th>
                        <td colspan="3"><textarea name="content" rows="5" th:text="${release.content}"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="toolbar right" style="justify-content:flex-end;">
                <a th:href="@{/release/list}" class="btn btn-default">목록</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
