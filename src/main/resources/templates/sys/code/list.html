<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('공통코드관리')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('code')}"></nav>
    <main class="content">
        <div class="breadcrumb">기준정보 관리 &gt; 공통코드관리</div>
        <div class="page-head">
            <div>
                <div class="page-title">공통코드관리</div>
                <div class="page-desc">코드그룹별 공통코드 등록 및 관리</div>
            </div>
            <div class="toolbar">
                <a th:href="@{/sys/code/write}" class="btn btn-primary">＋ 코드 등록</a>
            </div>
        </div>

        <form method="get" th:action="@{/sys/code/list}" class="searchbar">
            <input type="text" name="searchCondition" th:value="${searchVO.searchCondition}" placeholder="코드그룹"/>
            <input type="text" name="searchKeyword" th:value="${searchVO.searchKeyword}" placeholder="코드값/코드명 검색"/>
            <button type="submit" class="btn btn-default">검색</button>
        </form>

        <div class="panel mb0">
            <p style="margin-bottom:10px;color:#777;font-size:13px;">총 <b th:text="${totalCnt}">0</b>건</p>
            <table class="list">
                <thead>
                <tr>
                    <th style="width:200px;">코드그룹</th>
                    <th style="width:160px;">코드값</th>
                    <th>코드명</th>
                    <th class="center" style="width:90px;">정렬순서</th>
                    <th class="center" style="width:80px;">사용여부</th>
                    <th class="center" style="width:80px;">수정</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${codeList}">
                    <td th:text="${c.codeGrp}">코드그룹</td>
                    <td th:text="${c.codeId}">코드값</td>
                    <td th:text="${c.codeNm}">코드명</td>
                    <td class="center" th:text="${c.sortOrdr}">0</td>
                    <td class="center" th:text="${c.useAt}">Y</td>
                    <td class="center">
                        <a th:href="@{/sys/code/edit(codeGrp=${c.codeGrp},codeId=${c.codeId},codeNm=${c.codeNm},sortOrdr=${c.sortOrdr},useAt=${c.useAt})}">수정</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(codeList)}"><td colspan="6" class="empty">등록된 코드가 없습니다.</td></tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/common :: paging(${pageInfo}, '/sys/code/list')}"></div>
        </div>
    </main>
</div>
</body>
</html>
