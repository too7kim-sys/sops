<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('사용자관리')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('user')}"></nav>
    <main class="content">
        <div class="breadcrumb">기준정보 관리 &gt; 사용자관리</div>
        <div class="page-head">
            <div>
                <div class="page-title">사용자관리</div>
                <div class="page-desc">운영자 계정 등록 및 권한 관리</div>
            </div>
            <div class="toolbar">
                <a th:href="@{/sys/user/write}" class="btn btn-primary">＋ 사용자 등록</a>
            </div>
        </div>

        <form method="get" th:action="@{/sys/user/list}" class="searchbar">
            <select name="searchCondition">
                <option value="">전체 권한</option>
                <option value="ADMIN" th:selected="${searchVO.searchCondition == 'ADMIN'}">운영관리자</option>
                <option value="OPERATOR" th:selected="${searchVO.searchCondition == 'OPERATOR'}">운영자</option>
                <option value="USER" th:selected="${searchVO.searchCondition == 'USER'}">일반사용자</option>
            </select>
            <input type="text" name="searchKeyword" th:value="${searchVO.searchKeyword}" placeholder="사용자ID/사용자명 검색"/>
            <button type="submit" class="btn btn-default">검색</button>
        </form>

        <div class="panel mb0">
            <p style="margin-bottom:10px;color:#777;font-size:13px;">총 <b th:text="${totalCnt}">0</b>건</p>
            <table class="list">
                <thead>
                <tr>
                    <th style="width:140px;">사용자ID</th>
                    <th style="width:140px;">사용자명</th>
                    <th class="center" style="width:110px;">권한</th>
                    <th style="width:140px;">부서</th>
                    <th>이메일</th>
                    <th class="center" style="width:80px;">사용여부</th>
                    <th class="center" style="width:130px;">등록일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${userList}">
                    <td><a th:href="@{/sys/user/edit/{id}(id=${u.userId})}" th:text="${u.userId}">id</a></td>
                    <td th:text="${u.userNm}">사용자명</td>
                    <td class="center" th:switch="${u.role}">
                        <span th:case="'ADMIN'">운영관리자</span>
                        <span th:case="'OPERATOR'">운영자</span>
                        <span th:case="'USER'">일반사용자</span>
                        <span th:case="*" th:text="${u.role}">권한</span>
                    </td>
                    <td th:text="${u.deptNm}">부서</td>
                    <td th:text="${u.email}">이메일</td>
                    <td class="center" th:text="${u.useAt}">Y</td>
                    <td class="center" th:text="${u.regDt}">등록일</td>
                </tr>
                <tr th:if="${#lists.isEmpty(userList)}"><td colspan="7" class="empty">등록된 사용자가 없습니다.</td></tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/common :: paging(${pageInfo}, '/sys/user/list')}"></div>
        </div>
    </main>
</div>
</body>
</html>
