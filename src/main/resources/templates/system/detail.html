<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('응용시스템 상세')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="layout">
    <nav th:replace="~{fragments/common :: sidebar('system')}"></nav>
    <main class="content">
        <div class="breadcrumb">기준정보 관리 &gt; 응용시스템 &gt; 상세</div>
        <div class="page-head">
            <div class="page-title">응용시스템 상세 <span style="color:#888;font-weight:400;">(<span th:text="${system.sysId}">SYS001</span>)</span></div>
            <div class="toolbar">
                <a th:href="@{/system/edit/{id}(id=${system.sysId})}" class="btn btn-default">수정</a>
                <form th:action="@{/system/delete/{id}(id=${system.sysId})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="panel">
            <h3>시스템 정보</h3>
            <table class="form">
                <tr><th>시스템ID</th><td th:text="${system.sysId}">SYS001</td></tr>
                <tr><th>시스템명</th><td th:text="${system.sysNm}">시스템명</td></tr>
                <tr><th>중요도등급</th><td>
                    <span th:switch="${system.grad}">
                        <span th:case="'1'">1등급(상)</span>
                        <span th:case="'2'">2등급(중)</span>
                        <span th:case="'3'">3등급(하)</span>
                        <span th:case="*" th:text="${system.grad}">-</span>
                    </span>
                </td></tr>
                <tr><th>운영담당자</th><td th:text="${system.mngrNm} ?: '-'">담당자</td></tr>
                <tr><th>운영부서</th><td th:text="${system.mngrDept} ?: '-'">부서</td></tr>
                <tr><th>사용여부</th><td th:text="${system.useAt == 'Y'}?'사용':'미사용'">사용</td></tr>
                <tr><th>등록일</th><td th:text="${system.regDt} ?: '-'">일시</td></tr>
                <tr><th>시스템설명</th><td style="white-space:pre-line;" th:text="${system.sysDesc} ?: '-'">설명</td></tr>
            </table>
        </div>

        <div class="toolbar"><a th:href="@{/system/list}" class="btn btn-default">＜ 목록</a></div>
    </main>
</div>
</body>
</html>
